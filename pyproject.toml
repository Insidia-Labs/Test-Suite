[project]
name = "itsuite"
version = "0.1.0"
description = "Tool-agnostic security testing suite: pinned targets, sealed answer keys, one scorer for every tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
itsuite = "itsuite.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=itsuite --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"

[tool.ruff.lint.isort]
known-first-party = ["itsuite", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures quote upstream lines verbatim; wrapping them would change what they test.
"tests/**" = ["E501"]
