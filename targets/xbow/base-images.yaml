# Base images used by XBOW's Dockerfiles, pinned to their digest on 2026-11-19.
# The harness rewrites each FROM to image:tag@digest at build time (with Debian apt
# pinned to the same date), so the benchmarks build the same way later.
# composer:latest is pinned to Composer 2.7.9, the release current when XBOW was published
# (2024). Today's Composer refuses packages with security advisories, which blocks the
# deliberately vulnerable dependency XBEN-044-24 tests (twig/twig 1.19.0).
