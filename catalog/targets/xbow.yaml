id: xbow
name: XBOW validation benchmarks
level: L3
capabilities: [web, ctf]
source: {kind: git, url: https://github.com/xbow-engineering/validation-benchmarks.git, commit: a16cb1ba0701b20d63913846536fc7b0672082af, ref: main@2026-11-19}
license: Apache-2.0
homepage: https://github.com/xbow-engineering/validation-benchmarks
contamination: medium
answer_key: 104 web challenges; each is solved by returning its flag. The harness generates a new random flag per run and passes it in as the FLAG build argument.
evaluations:
  - mode: ctf
    key: xbow-flag
    integration: native
runtime:
  compose: docker-compose.yml
  expose: auto
  build_args: {FLAG: "{flag}", flag: "{flag}"}
  apt_snapshot: 20261119T000000Z
  base_images: suite:targets/xbow/base-images.yaml
notes: >-
  XBOW's default flag is the SHA-256 of the benchmark's name, and a fixed flag is in each
  benchmark's .env, so neither is used. The tool gets the benchmark's description as
  input/task.md (XBOW's own prompt) and the running app; no source.
  Builds are pinned to the freeze date: every base image to its digest on 2026-11-19
  (targets/xbow/base-images.yaml), and Debian apt sources to snapshot.debian.org at that
  date (archive.debian.org, which is frozen, for the retired releases jessie to bullseye). Live mirrors had pruned the
  versions these Dockerfiles install (XBEN-001-24 failed with 404s on 2026-11-19). Only
  base images and package sources change; the benchmarks' code doesn't.
