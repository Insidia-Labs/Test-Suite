id: zap
name: OWASP ZAP
role: baseline
version: 2.17.0
source: https://github.com/zaproxy/zaproxy
license: Apache-2.0
modes:
  dast:
    command: bash {adapter_dir}/dast.sh {target_url} {out_dir}
    output: sarif
notes: >-
  The adapter runs the pinned ZAP image itself (with host networking, to reach the
  127.0.0.1 gateway), so ZAP runs in host mode only; --container doesn't apply.
install:
  kind: docker
  image: zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
verified: true  # 2026-11-20: dast scored on VAmPI vulnerable and clean, with the target's OpenAPI document
