id: argus
name: Insidia Argus
role: under-test
version: 1.0.0
source: https://github.com/Rushi-Balapure/Insidia-Labs-Argus
license: Apache-2.0
modes:
  dast:
    command: bash {adapter_dir}/dast.sh {target_url} {out_dir}
    output: sarif
  sast:
    command: bash {adapter_dir}/sast.sh {source_dir} {out_dir}
    output: sarif
  secrets:
    command: bash {adapter_dir}/sast.sh {source_dir} {out_dir}
    output: sarif
notes: >-
  Runs the installed `insidia` CLI with policy L1. Set ITS_ARGUS_KIND (web, api, chat...)
  to override the target kind Argus would guess from the URL.
install:
  kind: pip
  packages: ['insidia @ git+https://github.com/Rushi-Balapure/Insidia-Labs-Argus@f783775a18b5b940012be0f3f3e75b058e743dc3#subdirectory=core']
  binaries: [insidia]
