id: trufflehog
name: TruffleHog
role: baseline
version: 3.99.9
source: https://github.com/trufflesecurity/trufflehog
license: AGPL-3.0
modes:
  secrets:
    command: bash {adapter_dir}/secrets.sh {source_dir} {out_dir}
    output: trufflehog-jsonl
    output_file: results.jsonl
notes: Verification is off, so found secrets are never sent to the services they belong to.
