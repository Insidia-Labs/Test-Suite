id: semgrep
name: Semgrep CE
role: baseline
version: 1.186.0
source: https://github.com/semgrep/semgrep
license: LGPL-2.1-or-later
modes:
  sast:
    command: bash {adapter_dir}/sast.sh {source_dir} {out_dir}
    output: sarif
notes: Uses the p/default registry ruleset, which is not pinned by Semgrep.
install:
  kind: pip
  packages: [semgrep==1.186.0]
  binaries: [semgrep, pysemgrep]
verified: true  # 2026-11-20: sast scored on OWASP Benchmark Python (1,230 cases)
