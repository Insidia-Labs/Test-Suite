id: bandit
name: Bandit
role: baseline
version: 1.9.4
source: https://github.com/PyCQA/bandit
license: Apache-2.0
modes:
  sast:
    command: bash {adapter_dir}/sast.sh {source_dir} {out_dir}
    output: sarif
notes: Python only; install with the sarif extra (pip install "bandit[sarif]==1.9.4").
install:
  kind: pip
  packages: ['bandit[sarif]==1.9.4']
  binaries: [bandit]
