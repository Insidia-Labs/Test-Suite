id: lynx
name: Insidia Lynx
role: under-test
version: 0.0.1
source: https://github.com/Insidia-Labs/Lynx
license: GPL-3.0
modes:
  sast:
    command: bash {adapter_dir}/sast.sh {source_dir} {out_dir}
    output: sarif
notes: >-
  Runs the installed `lynx scan` on the source view. Today that runs gitleaks and
  OSV-Scanner, so install both as well. OSV-Scanner reads lockfiles only and looks them
  up in the public OSV database, so it needs network access. More modes (secrets, sca,
  dast, ctf, agent-attack, exploit, fix, pr-review) get adapters as Lynx builds them.
install:
  kind: pip
  python: "3.14"
  packages: ['insidia-labs-lynx @ git+https://github.com/Insidia-Labs/Lynx@4196164e4fbbab33ded4949b87d65f95880d7001']
  binaries: [lynx]
verified: true  # 2026-11-25: sast scored on Juice Shop (30 cases, 75 findings parsed)
