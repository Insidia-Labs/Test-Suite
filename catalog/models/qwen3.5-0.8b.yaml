id: qwen3.5-0.8b
name: Qwen3.5 0.8B
license: Apache-2.0
repo: Qwen/Qwen3.5-0.8B
revision: 2fc06364715b967f1860aea9cf38778875588b17
served_name: suite-model
server_package: vllm==0.34.0
server_args: [--language-model-only, --max-model-len, "16384", --max-num-seqs, "4",
              --kv-cache-memory-bytes, "536870912", --gpu-memory-utilization, "0.45",
              --attention-backend, FLASH_ATTN, --seed, "0"]
port: 8000
notes: >-
  The model LLM-backed targets (Damn Vulnerable LLM Agent, AI Goat) run on, so their
  behaviour is the same for every tool. Small enough to answer quickly on the host GPU
  (an RTX 5060 Ti with 8 GB, shared with the desktop): 1.6 GB of bf16 weights, served
  text-only (--language-model-only skips the vision encoder). It answers in non-thinking
  mode by default, so replies carry no reasoning block. The KV cache is a fixed 512 MiB
  (only 6 of its 24 layers keep one) rather than sized from free memory, so every run gets
  the same cache. FlashAttention is chosen because its kernels ship prebuilt; FlashInfer
  compiles kernels at startup and needs a CUDA toolkit. Targets reach the model through one
  gateway container and have no other way out.
